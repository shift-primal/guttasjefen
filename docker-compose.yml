services:
  bot:
    build: .
    container_name: guttasjefen
    restart: unless-stopped
    env_file: .env
    volumes:
      # Mounted as a folder (cookies.txt included) so edits show up even when a file is replaced
      - ./config:/app/config:ro
      # Profiles the bot keeps on each user, written at runtime
      - ./data:/app/data
